# Server block for the Nginx that already runs on the VPS.
# Copy to /etc/nginx/sites-available/knmi.turmin.com, link it into sites-enabled,
# then: sudo certbot --nginx -d knmi.turmin.com && sudo nginx -t && sudo systemctl reload nginx
#
# The port must match WEB_PORT in .env (default 8090).

server {
    listen 80;
    listen [::]:80;
    server_name knmi.turmin.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name knmi.turmin.com;

    # Filled in by certbot
    # ssl_certificate /etc/letsencrypt/live/knmi.turmin.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/knmi.turmin.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        # Replace (not append) so a visitor cannot spoof their IP for the /admin check
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
