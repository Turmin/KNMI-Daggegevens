# Nginx inside the "web" container. Replaces the rules in .htaccess.
# SSL and the http->https redirect are done by the Nginx on the VPS in front of
# this container (see docker/host-nginx/knmi.turmin.com.conf).

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # The VPS Nginx connects from the Docker network; trust its X-Forwarded-For
    # so $remote_addr (and the /admin allow rule below) is the real visitor IP.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server_tokens off;
    # Relative redirects (/admin -> /admin/), so they keep https and the public hostname.
    absolute_redirect off;
    client_max_body_size 2m;

    # Error pages (ErrorDocument in .htaccess)
    error_page 400 /error.php?code=400;
    error_page 401 /error.php?code=401;
    error_page 403 /error.php?code=403;
    error_page 404 /error.php?code=404;
    error_page 405 /error.php?code=405;
    error_page 408 /error.php?code=408;
    error_page 429 /error.php?code=429;
    error_page 500 /error.php?code=500;
    error_page 502 /error.php?code=502;
    error_page 503 /error.php?code=503;
    error_page 504 /error.php?code=504;

    location = /error.php {
        internal;
        include /etc/nginx/snippets/php-fpm.conf;
    }

    # Admin is only reachable from this IP address
    location ^~ /admin {
        allow 85.145.36.255;
        deny all;

        location ~ \.php$ {
            include /etc/nginx/snippets/php-fpm.conf;
        }
        try_files $uri $uri/ =404;
    }

    location = /manifest.json {
        types { }
        default_type application/manifest+json;
    }

    # Pretty URLs (RewriteRules in .htaccess)
    location = /api/weather {
        rewrite ^ /api/weather.php last;
    }
    location ^~ /api/weather/ {
        rewrite ^/api/weather/(.*)$ /api/weather.php/$1 last;
    }
    location = /yearly {
        rewrite ^ /yearly.php last;
    }
    location ~ "^/([0-9]{4}-[0-9]{2}-[0-9]{2})/?$" {
        rewrite "^/([0-9]{4}-[0-9]{2}-[0-9]{2})/?$" /index.php?date=$1 last;
    }

    # PHP, including PATH_INFO (/api/weather.php/day)
    location ~ ^(.+\.php)(/.*)?$ {
        include /etc/nginx/snippets/php-fpm.conf;
    }

    # Long cache for versioned or rarely changing static files
    location ~* \.(css|js|png|ico|svg|woff2?|pdf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Never serve dotfiles (.htaccess, .git, ...)
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
