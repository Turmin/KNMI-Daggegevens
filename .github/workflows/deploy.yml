name: Deploy to VPS

# Pulls the latest code on the VPS and rebuilds the Docker containers.
# Repository secrets needed:
#   VPS_HOST     host name or IP of the VPS
#   VPS_USER     SSH user that may run docker compose
#   VPS_SSH_KEY  private key for that user (a key only for this deploy)
#   VPS_PATH     folder with the clone on the VPS, e.g. /opt/knmi
# The VPS clones the public repo over HTTPS, so it needs no GitHub credentials.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Pull and rebuild
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" "set -e
            cd '$VPS_PATH'
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f >/dev/null"
